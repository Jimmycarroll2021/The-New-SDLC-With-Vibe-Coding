trigger:
  branches:
    include: [main, master, release/*]
pr:
  branches:
    include: ["*"]

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    fetchDepth: 0
  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.11"
  # Add dependency installs here if tests.command needs them
  - script: |
      set -euo pipefail
      # A pull request validation build is a merge commit, so its first parent is the exact base
      # that was merged. That needs no fetch and no persisted credentials, and it does not move if
      # the target branch advances mid-run.
      BASE_SHA=$(git rev-parse --verify --quiet "HEAD^1" || true)
      if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:.agentic/gate.py" 2>/dev/null; then
        echo "policy, runner and CI changes proposed by this pull request:"
        git diff --stat "$BASE_SHA...HEAD" -- .agentic agentic.toml azure-pipelines.yml
        TRUSTED="$(Agent.TempDirectory)/trusted-gates"
        mkdir -p "$TRUSTED"
        git archive "$BASE_SHA" .agentic | tar -x -C "$TRUSTED"
        echo "judging with .agentic/gate.py as it exists at $BASE_SHA"
        python "$TRUSTED/.agentic/gate.py" --root . --stage ci --base "$BASE_SHA"
      else
        echo "no runner on the base ref (first install), or not a merge build: using this tree's own"
        python .agentic/gate.py --stage ci
      fi
    displayName: agentic gates
    # The judge must never be the branch's own copy, so the base ref's runner is unpacked outside
    # the working tree and pointed at it. This cannot protect this file: the pipeline definition
    # comes from the branch. Use a branch policy that requires this build and required reviewers on
    # azure-pipelines.yml, .agentic/ and agentic.toml.
  - publish: .agentic/last-report.json
    artifact: agentic-gate-report
    condition: always()
